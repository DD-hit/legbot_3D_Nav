<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>迹航 · 手动控制</title>
<style>*{box-sizing:border-box}body{background:#f5f6f8;color:#202930;font:16px system-ui;margin:0;padding:clamp(20px,5vw,64px)}main{background:white;max-width:440px;padding:28px;border:1px solid #dee2e7;border-radius:18px}h1{font-size:23px;margin:0}p,output{font-size:14px;color:#57636b}#pad{position:relative;display:grid;place-items:center;margin:30px auto;width:min(225px,65vw);aspect-ratio:1;border:1px solid #cdd7d5;border-radius:50%;background:linear-gradient(90deg,transparent 49.7%,#cfdad7 50%,transparent 50.3%),linear-gradient(transparent 49.7%,#cfdad7 50%,transparent 50.3%),#edf3f1}#knob{width:32%;height:32%;border-radius:50%;background:#247563;box-shadow:0 3px 8px #0002;pointer-events:none}button,#pad{touch-action:none;user-select:none;-webkit-user-select:none}button{border:1px solid #cfd5da;border-radius:10px;background:white;padding:12px 20px;color:inherit;font:inherit}button:active{background:#edf3f1}.buttons{display:flex;justify-content:center;gap:12px}output{display:block;margin-top:22px}</style>
<main><h1>手动控制</h1><p><button id="connect">连接控制权</button> <button id="release" disabled>释放控制权</button></p><p><button data-pose="stand" disabled>站立</button> <button data-pose="lie" disabled>蹲下</button></p><p>以狗头为前方。拖动摇杆平移，按住按钮原地转向，松开停车。</p><div id="pad" aria-label="平移摇杆"><div id="knob"></div></div><div class="buttons"><button data-turn="1">原地左转</button><button data-turn="-1">原地右转</button></div><output role="status">等待操作</output></main>
<script type="module" src="/manual.js"></script></html>
